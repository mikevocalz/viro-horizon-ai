name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Viro's peer deps lag RN 0.86; resolution is forced via `overrides`.
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
